name: mcare
description: "mCare — Remote Patient Monitoring & Healthcare Management Platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  http: ^1.2.2
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter
  web: ^1.1.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  file_picker: ^8.1.1
  share_plus: ^10.1.4
  # README §7.1 — WebSocket client for the Reverb (Pusher-protocol) channel.
  # Pure-Dart, works across web/mobile/desktop with no native deps.
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Native launcher / app icons. Regenerate after changing the source image with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#6366F1"
  min_sdk_android: 21
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  web:
    generate: true
    background_color: "#6366F1"
    theme_color: "#6366F1"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
