<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="mCare — Remote Patient Monitoring & Healthcare Management.">
  <meta name="google-signin-client_id" content="937360649671-3fnpje16hqhamfpemih9k2kub8o9e3f2.apps.googleusercontent.com">
  <meta name="theme-color" content="#EEF0FB">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mCare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mCare</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="dns-prefetch" href="https://accounts.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
  </noscript>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; min-height: 100dvh;
      background: #EEF0FB;   /* same tint as splash — no white flash */
      overflow: hidden;
    }

    /* Keep Flutter's rendering surface BELOW the HTML splash (z-index: 9999).
       Without this, flt-glass-pane is inserted after #mc-splash in the DOM
       and wins the stacking order — showing blank before the first frame.   */
    flutter-view {
      z-index: 1 !important;
    }
    flutter-view, flt-glass-pane, flt-scene-host, flt-scene, flt-scene canvas {
      background-color: #F6F7FB !important;
    }

    /* ── Splash ─────────────────────────────────────────────────────
       Visible the moment the first byte of CSS is applied.
       CSS radial-gradients replace filter-blur divs — they render
       instantly in the first paint with zero JS dependency.          */
    #mc-splash {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 62% 56% at 92%  -4%, rgba(99,102,241,.22) 0%, transparent 64%),
        radial-gradient(ellipse 58% 50% at -4%  96%, rgba(14,165,233,.18) 0%, transparent 64%),
        radial-gradient(ellipse 44% 40% at -3%  48%, rgba(16,185,129,.14) 0%, transparent 64%),
        radial-gradient(ellipse 50% 44% at 96%  30%, rgba(139,92,246,.15) 0%, transparent 64%),
        radial-gradient(ellipse 40% 36% at 54%  84%, rgba(227,160,8,.13)  0%, transparent 64%),
        #F6F7FB;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      /* No opacity:0 — always visible immediately */
    }
    /* Dismiss: instantly hidden + non-interactive if class stuck */
    #mc-splash.out {
      display: none !important;
      pointer-events: none !important;
    }

    /* ── Brand content ──────────────────────────────────────────── */
    #mc-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center center;
      will-change: transform;
    }

    /* fontSize = logoSplash(104) × 0.72 ≈ 75px */
    #mc-wordmark {
      display: flex;
      align-items: baseline;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 75px;
      font-weight: 600;
      letter-spacing: -1.5px;
      line-height: 1;
    }
    #mc-m    { color: #6366F1; }
    #mc-care { color: #0F172A; }

    /* ECG: 104 × 1.15 = 120px wide, 104 × 0.24 = 25px tall */
    #mc-ecg {
      display: block;
      width: 120px;
      height: 25px;
      margin-top: 5px;
    }

    #mc-tagline {
      margin-top: 16px;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: #64748B;
      letter-spacing: .02em;
    }
  </style>
</head>
<body>

  <div id="mc-splash">
    <div id="mc-brand">
      <div id="mc-wordmark">
        <span id="mc-m">m</span><span id="mc-care">Care</span>
      </div>
      <canvas id="mc-ecg" aria-hidden="true"></canvas>
      <p id="mc-tagline">Remote care, connected</p>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async data-mcare-gsi="true"></script>
  <!-- Sign in with Apple (JS SDK). Only initialised by the app when
       MCARE_APPLE_CLIENT_ID is configured; harmless otherwise. -->
  <script type="text/javascript"
          src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"
          async data-mcare-apple="true"></script>

  <script>
  /* ── Dismiss — only when Dart confirms Flutter splash/content is painted ── */
  (function () {
    var splash = document.getElementById('mc-splash');
    var done   = false;
    function dismiss() {
      if (done) return;
      done = true;
      if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
    }
    window.addEventListener('mcare-ready', dismiss, { once: true });
    setTimeout(dismiss, 30000);
  }());

  /* ── BrandLogo animation — mirrors brand_logo.dart exactly ─────────── */
  (function () {
    var canvas  = document.getElementById('mc-ecg');
    var brandEl = document.getElementById('mc-brand');
    var mEl     = document.getElementById('mc-m');
    if (!canvas || !canvas.getContext) return;

    var CYCLE    = 1400;
    var BASE_RGB = [99, 102, 241];
    var PALETTE  = [
      '#6366F1','#E11D48','#057A55','#0EA5E9','#8B5CF6',
      '#D97706','#14B8A6','#7E3AF2','#E3A008','#10B981',
      '#EF4444','#F59E0B','#3B82F6'
    ];

    function h2r(h) { return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
    function lerp3(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]; }
    function rgb(c)     { return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
    function rgba(c,a)  { return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(3)+')'; }

    function pickPair() {
      var a=PALETTE[Math.floor(Math.random()*PALETTE.length)],b;
      do{b=PALETTE[Math.floor(Math.random()*PALETTE.length)];}while(b===a);
      return [h2r(a),h2r(b)];
    }

    /* _HeartbeatRhythm.scale */
    function bScale(t){
      if(t<0.12)return 1+(t/0.12)*0.085;
      if(t<0.20)return 1.085-((t-0.12)/0.08)*0.055;
      if(t<0.30)return 1.03+((t-0.20)/0.10)*0.055;
      if(t<0.42)return 1.085-((t-0.30)/0.12)*0.085;
      return 1;
    }
    function lubI(t){ var d=Math.abs((t-0.12)/0.10); return d>=1?0:Math.max(0,1-d); }
    function dubI(t){ var d=Math.abs((t-0.30)/0.09); return d>=1?0:Math.max(0,1-d); }

    function mCol(t,l,d){ var c=BASE_RGB.slice(),li=lubI(t),di=dubI(t); if(li>0)c=lerp3(c,l,li*0.95); if(di>0)c=lerp3(c,d,di*0.95); return c; }
    function tCol(t,l,d){ var b=BASE_RGB; if(t<=0.10)return b; if(t<=0.14)return lerp3(b,l,(t-0.10)/0.04); if(t<=0.32)return lerp3(l,d,(t-0.14)/0.18); if(t<=0.83)return lerp3(d,b,(t-0.32)/0.51); return b; }

    function ecgA(t){ if(t<0.06)return 0; if(t<0.11)return(t-0.06)/0.05; if(t<0.83)return 1; if(t<0.95)return 1-(t-0.83)/0.12; return 0; }
    function ecgR(t){ if(t<=0.11)return 0; if(t>=0.83)return 1; var x=(t-0.11)/0.72; return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2; }
    function swp(t) { return t<0.08?0:t>0.88?1:(t-0.08)/0.80; }
    function swpA(t){ if(t<0.05)return 0; if(t<0.08)return(t-0.05)/0.03; if(t<0.88)return 0.85; if(t<0.92)return 0.85*(1-(t-0.88)/0.04); return 0; }

    var dpr=window.devicePixelRatio||1, W=120, H=25;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);

    var PX=[0,19/118,21/118,23/118,29/118,30/118,33/118,37/118,38/118,44/118,108/118];
    var PY=[14/24,14/24,13/24,14/24,14/24,17/24,1/24,23/24,14/24,14/24,14/24];

    function rr(x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
    }

    var ts0=null,lc=-1,lR=h2r('#E11D48'),dR=h2r('#0EA5E9');

    function frame(ts){
      if(!ts0)ts0=ts;
      var el=ts-ts0,t=(el%CYCLE)/CYCLE,ci=Math.floor(el/CYCLE);
      if(ci!==lc){var p=pickPair();lR=p[0];dR=p[1];lc=ci;}

      brandEl.style.transform='scale('+bScale(t).toFixed(4)+')';
      mEl.style.color=rgb(mCol(t,lR,dR));

      ctx.clearRect(0,0,W,H);
      var al=ecgA(t);
      if(al>0.01){
        var my=(14/24)*H;
        var bs=0.78+0.11*(1-Math.cos(2*Math.PI*t));
        var bW=W*0.75*bs,bH=H*0.18,bA=Math.min((0.10+0.08*(1-Math.cos(2*Math.PI*t)))*al,1);
        rr((W-bW)/2,my-bH/2,bW,bH,bH/2); ctx.fillStyle=rgba(BASE_RGB,bA); ctx.fill();

        var sA=swpA(t)*al;
        if(sA>0.01){
          var sx=swp(t)*W*(78/118),pW=W*0.34,pH=H*0.35;
          var lf=Math.max(0,Math.min(sx-pW/2,W-pW));
          var g=ctx.createLinearGradient(lf,0,lf+pW,0);
          g.addColorStop(0,rgba(BASE_RGB,0));
          g.addColorStop(0.5,rgba(BASE_RGB,Math.min(0.35*sA,1)));
          g.addColorStop(1,rgba(BASE_RGB,0));
          rr(lf,my-pH/2,pW,pH,pH/2); ctx.fillStyle=g; ctx.fill();
        }

        var rv=ecgR(t);
        if(rv>0.001){
          var tc=tCol(t,lR,dR);
          ctx.save(); ctx.globalAlpha=al;
          ctx.beginPath(); ctx.rect(0,0,rv*W,H); ctx.clip();
          ctx.shadowColor=rgb(tc); ctx.shadowBlur=3;
          ctx.strokeStyle=rgb(tc); ctx.lineWidth=Math.max(1,H*0.11);
          ctx.lineCap='round'; ctx.lineJoin='round';
          ctx.beginPath(); ctx.moveTo(PX[0]*W,PY[0]*H);
          for(var i=1;i<PX.length;i++) ctx.lineTo(PX[i]*W,PY[i]*H);
          ctx.stroke(); ctx.restore();
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }());

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function(){});
    });
  }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
